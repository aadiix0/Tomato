<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zonein Taskbar Island</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    :root {
      --accent: #a78bfa;
      --accent-2: #38bdf8;
      --accent-glow: rgba(167, 139, 250, 0.55);
      --goal-1: #fbbf24;
      --goal-2: #34d399;
      --goal-glow: rgba(52, 211, 153, 0.45);
      --pill-bg: #08090f;
    }

    .island-shell {
      position: relative;
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 6px 0 5px;
      border-radius: 13px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.015) 48%, rgba(0, 0, 0, 0.25) 100%),
        var(--pill-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.65),
        0 0 0 0.5px rgba(0, 0, 0, 0.92),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      cursor: pointer;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.28s ease,
        border-color 0.28s ease;
      overflow: hidden;
    }

    /* Outer border = Daily Focus Goal Progress */
    .island-shell::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 13px;
      padding: 1.6px;
      background: conic-gradient(
        from -90deg,
        var(--goal-1) 0deg,
        var(--goal-2) calc(var(--goal-pct, 0) * 3.6deg),
        rgba(255, 255, 255, 0.1) calc(var(--goal-pct, 0) * 3.6deg)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .island-shell.no-goal::before {
      background: rgba(255, 255, 255, 0.14);
      opacity: 0.6;
    }

    .island-shell.goal-complete::before {
      background: conic-gradient(
        from -90deg,
        #34d399 0deg,
        #2dd4bf 180deg,
        #fbbf24 360deg
      );
      opacity: 1;
      filter: drop-shadow(0 0 3px var(--goal-glow));
    }

    .island-shell:hover {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.78),
        0 0 12px -4px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .island-shell.unlocked {
      cursor: grab;
    }

    .island-shell.unlocked::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 11px;
      border: 1px dashed rgba(255, 255, 255, 0.24);
      pointer-events: none;
    }

    .island-shell.dragging {
      cursor: grabbing;
      transform: scale(0.985);
    }

    /* Ambient mode aura */
    .island-aura {
      position: absolute;
      left: -4px;
      top: 50%;
      width: 68px;
      height: 54px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 72%);
      opacity: 0.28;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .island-shell.running .island-aura {
      animation: auraPulse 2.8s ease-in-out infinite;
    }

    .island-shell.paused .island-aura {
      opacity: 0.14;
    }

    @keyframes auraPulse {
      0%, 100% {
        opacity: 0.22;
        transform: translateY(-50%) scale(0.95);
      }
      50% {
        opacity: 0.55;
        transform: translateY(-50%) scale(1.12);
      }
    }

    /* Edge resize handles (only active when unlocked via right-click menu) */
    .resize-handle {
      display: none;
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 7px;
      z-index: 6;
      cursor: ew-resize;
      align-items: center;
      justify-content: center;
    }

    .island-shell.unlocked .resize-handle {
      display: flex;
    }

    .resize-handle.left {
      left: 0;
    }

    .resize-handle.right {
      right: 0;
    }

    .resize-handle::before {
      content: '';
      width: 2px;
      height: 14px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.5);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .resize-handle:hover::before {
      background: var(--accent);
      transform: scaleY(1.15);
    }

    /* Inner Adaptive Rounded-Rect Progress Ring with Timer Inside */
    .timer-badge {
      position: relative;
      height: 26px;
      min-width: 54px;
      padding: 0 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 2;
    }

    .badge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .badge-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.13);
      stroke-width: 2;
    }

    .badge-progress {
      fill: none;
      stroke: url(#badgeGrad);
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 0 3px var(--accent-glow));
    }

    .island-shell.paused .badge-progress {
      filter: none;
      opacity: 0.78;
    }

    .island-shell.infinite.running .badge-progress {
      stroke-dasharray: 30 70 !important;
      animation: squircleFlow 2.6s linear infinite;
      transition: none;
    }

    @keyframes squircleFlow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -100; }
    }

    .time-text {
      position: relative;
      z-index: 1;
      font-size: 12.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #ffffff;
      white-space: nowrap;
    }

    /* Mode label + optional wide-mode details */
    .info-block {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5px;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .mode-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .live-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent);
      flex-shrink: 0;
    }

    .island-shell.running .live-dot {
      animation: dotBlink 1.6s ease-in-out infinite;
    }

    .island-shell.paused .live-dot {
      background: #fbbf24;
      box-shadow: 0 0 4px rgba(251, 191, 36, 0.55);
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(0.75); }
    }

    .mode-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1;
      white-space: nowrap;
    }

    .wide-detail {
      display: none;
      font-size: 9.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.56);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .island-shell.show-wide-detail .wide-detail {
      display: block;
    }

    /* Sculpted Control Pod: Morphing Squircle Keycap + Docked Slim Skip Pill */
    .controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      position: relative;
      z-index: 3;
    }

    .squircle-keycap {
      position: relative;
      width: 30px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 2px 6px rgba(0, 0, 0, 0.4);
      transition:
        border-radius 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.22s ease,
        border-color 0.22s ease,
        color 0.22s ease,
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.22s ease;
    }

    .squircle-keycap:hover {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.07) 100%);
      transform: scale(1.05);
    }

    .squircle-keycap:active {
      transform: scale(0.9);
    }

    .island-shell.running .squircle-keycap {
      border-radius: 7px 11px 11px 7px;
      border-color: rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #07080d;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        0 0 10px -2px var(--accent-glow);
    }

    .island-shell.running .squircle-keycap:hover {
      filter: brightness(1.08);
    }

    .squircle-keycap svg {
      width: 12px;
      height: 12px;
      display: block;
    }

    .skip-pill {
      width: 19px;
      height: 26px;
      border-radius: 5px 9px 9px 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.065);
      color: rgba(248, 250, 252, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .skip-pill:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: scale(1.05);
    }

    .skip-pill:active {
      transform: scale(0.88);
    }

    .skip-pill svg {
      width: 10px;
      height: 10px;
      display: block;
    }

    /* Interval switch pop */
    .island-shell.flash {
      animation: islandPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes islandPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="island" class="island-shell paused no-goal" title="Click to open Zonein · Right-click for options">
    <div class="island-aura"></div>
    <div id="resizeLeft" class="resize-handle left" title="Drag to resize width"></div>
    <div id="resizeRight" class="resize-handle right" title="Drag to resize width"></div>

    <!-- Inner Adaptive Rounded-Rect Progress Ring with Live Timer Inside -->
    <div id="timerBadge" class="timer-badge">
      <svg id="badgeSvg" class="badge-svg" aria-hidden="true">
        <defs>
          <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop id="gradStop1" offset="0%" stop-color="#c084fc" />
            <stop id="gradStop2" offset="100%" stop-color="#38bdf8" />
          </linearGradient>
        </defs>
        <path id="badgeTrack" class="badge-track" />
        <path
          id="badgeProgress"
          class="badge-progress"
          pathLength="100"
          stroke-dasharray="100"
          stroke-dashoffset="0"
        />
      </svg>
      <span id="timeText" class="time-text">25:00</span>
    </div>

    <!-- Mode Label & Optional Wide Details -->
    <div class="info-block">
      <div class="mode-row">
        <span class="live-dot"></span>
        <span id="modeLabel" class="mode-label">FOCUS</span>
      </div>
      <div id="wideDetail" class="wide-detail"></div>
    </div>

    <!-- Morphing Squircle Keycap + Docked Slim Skip Pill -->
    <div class="controls">
      <button id="toggleBtn" class="squircle-keycap" type="button" title="Start" aria-label="Play or Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7.5 4.8c0-.9 1-1.45 1.78-.98l10.2 6.2c.74.45.74 1.51 0 1.96l-10.2 6.2c-.78.47-1.78-.08-1.78-.98V4.8z" />
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <rect x="6" y="4.5" width="4.4" height="15" rx="1.6" />
          <rect x="13.6" y="4.5" width="4.4" height="15" rx="1.6" />
        </svg>
      </button>

      <button id="skipBtn" class="skip-pill" type="button" title="Skip to next interval" aria-label="Skip interval">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4.5 5.2c0-.85.95-1.36 1.67-.9l8.35 5.3c.66.42.66 1.38 0 1.8l-8.35 5.3c-.72.46-1.67-.05-1.67-.9V5.2z" />
          <rect x="17" y="4.8" width="2.8" height="14.4" rx="1.2" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const island = document.getElementById('island');
    const resizeLeft = document.getElementById('resizeLeft');
    const resizeRight = document.getElementById('resizeRight');
    const timerBadge = document.getElementById('timerBadge');
    const badgeSvg = document.getElementById('badgeSvg');
    const badgeTrack = document.getElementById('badgeTrack');
    const badgeProgress = document.getElementById('badgeProgress');
    const timeText = document.getElementById('timeText');
    const modeLabel = document.getElementById('modeLabel');
    const wideDetail = document.getElementById('wideDetail');
    const toggleBtn = document.getElementById('toggleBtn');
    const skipBtn = document.getElementById('skipBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const gradStop1 = document.getElementById('gradStop1');
    const gradStop2 = document.getElementById('gradStop2');

    let lastMode = 'FOCUS';
    let lastState = null;
    let currentConfig = {
      locked: true,
      customWidth: 232,
      wideDetailMode: 'task',
      visibilityMode: 'always',
    };

    function formatGoalDuration(ms) {
      const totalMins = Math.floor(Math.max(0, Number(ms) || 0) / 60000);
      const h = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      if (h > 0 && m > 0) return `${h}h ${m}m`;
      if (h > 0) return `${h}h`;
      return `${m}m`;
    }

    function buildRoundedRectPath(w, h, radius, inset) {
      const left = inset;
      const top = inset;
      const right = Math.max(left + 2, w - inset);
      const bottom = Math.max(top + 2, h - inset);
      const iw = right - left;
      const ih = bottom - top;
      const r = Math.min(radius, iw / 2, ih / 2);
      const cx = left + iw / 2;

      return [
        `M ${cx.toFixed(2)} ${top.toFixed(2)}`,
        `L ${(right - r).toFixed(2)} ${top.toFixed(2)}`,
        `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${right.toFixed(2)} ${(top + r).toFixed(2)}`,
        `L ${right.toFixed(2)} ${(bottom - r).toFixed(2)}`,
        `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${(right - r).toFixed(2)} ${bottom.toFixed(2)}`,
        `L ${(left + r).toFixed(2)} ${bottom.toFixed(2)}`,
        `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${left.toFixed(2)} ${(bottom - r).toFixed(2)}`,
        `L ${left.toFixed(2)} ${(top + r).toFixed(2)}`,
        `A ${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${(left + r).toFixed(2)} ${top.toFixed(2)}`,
        `L ${cx.toFixed(2)} ${top.toFixed(2)} Z`,
      ].join(' ');
    }

    function syncBadgeGeometry() {
      const rect = timerBadge.getBoundingClientRect();
      const w = Math.max(48, Math.round(rect.width));
      const h = Math.max(24, Math.round(rect.height));
      badgeSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      const d = buildRoundedRectPath(w, h, 8, 1.35);
      badgeTrack.setAttribute('d', d);
      badgeProgress.setAttribute('d', d);
    }

    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => syncBadgeGeometry());
      ro.observe(timerBadge);
    }

    function setThemeForMode(mode) {
      const root = document.documentElement;
      if (mode === 'FOCUS') {
        root.style.setProperty('--accent', '#a78bfa');
        root.style.setProperty('--accent-2', '#38bdf8');
        root.style.setProperty('--accent-glow', 'rgba(167, 139, 250, 0.62)');
        gradStop1.setAttribute('stop-color', '#c084fc');
        gradStop2.setAttribute('stop-color', '#38bdf8');
      } else if (mode === 'SHORT_BREAK') {
        root.style.setProperty('--accent', '#34d399');
        root.style.setProperty('--accent-2', '#2dd4bf');
        root.style.setProperty('--accent-glow', 'rgba(52, 211, 153, 0.6)');
        gradStop1.setAttribute('stop-color', '#34d399');
        gradStop2.setAttribute('stop-color', '#2dd4bf');
      } else {
        root.style.setProperty('--accent', '#38bdf8');
        root.style.setProperty('--accent-2', '#818cf8');
        root.style.setProperty('--accent-glow', 'rgba(56, 189, 248, 0.6)');
        gradStop1.setAttribute('stop-color', '#38bdf8');
        gradStop2.setAttribute('stop-color', '#818cf8');
      }
    }

    function refreshWideDetail() {
      const isWideEnough = window.innerWidth >= 252;
      const detailMode = currentConfig.wideDetailMode || 'task';
      const showDetail = isWideEnough && detailMode !== 'off';
      island.classList.toggle('show-wide-detail', showDetail);

      if (!showDetail || !lastState) {
        wideDetail.textContent = '';
        return;
      }

      if (detailMode === 'goal') {
        const todayMs = Number(lastState.todayFocusMs || 0);
        const goalMs = Number(lastState.focusGoalMs || 0);
        wideDetail.textContent =
          goalMs > 0
            ? `${formatGoalDuration(todayMs)} / ${formatGoalDuration(goalMs)}`
            : `${formatGoalDuration(todayMs)} today`;
      } else {
        wideDetail.textContent = lastState.taskTitle || lastState.topicName || 'Focus';
      }
    }

    function applyConfig(cfg) {
      if (!cfg) return;
      currentConfig = { ...currentConfig, ...cfg };
      const unlocked = !currentConfig.locked;
      island.classList.toggle('unlocked', unlocked);
      island.title = unlocked
        ? 'Unlocked: drag to move, drag edges to resize · Right-click to lock'
        : 'Click to open Zonein · Right-click to unlock, resize, or customize';
      refreshWideDetail();
    }

    function applyState(state) {
      if (!state) return;
      lastState = state;

      const running = Boolean(state.timerRunning);
      const infinite = Boolean(state.infiniteFocus);
      const mode = state.timerMode || 'FOCUS';
      const rawProgress = typeof state.progress === 'number' ? state.progress : 1;
      const clamped = Math.max(0, Math.min(1, rawProgress));

      if (mode !== lastMode) {
        lastMode = mode;
        island.classList.remove('flash');
        void island.offsetWidth;
        island.classList.add('flash');
      }

      setThemeForMode(mode);

      island.classList.toggle('running', running);
      island.classList.toggle('paused', !running);
      island.classList.toggle('infinite', infinite && mode === 'FOCUS');

      timeText.textContent = state.timeStr || '25:00';
      modeLabel.textContent =
        mode === 'FOCUS'
          ? infinite
            ? 'FLOW'
            : 'FOCUS'
          : mode === 'SHORT_BREAK'
            ? 'BREAK'
            : 'LONG';

      playIcon.style.display = running ? 'none' : 'block';
      pauseIcon.style.display = running ? 'block' : 'none';
      toggleBtn.title = running ? 'Pause' : 'Start';

      // Inner adaptive rounded-rect ring = current Focus / Break progress
      if (infinite && mode === 'FOCUS') {
        badgeProgress.style.opacity = '1';
        badgeProgress.style.strokeDasharray = '30 70';
        badgeProgress.style.strokeDashoffset = '0';
      } else {
        badgeProgress.style.opacity = clamped <= 0.002 ? '0' : '1';
        badgeProgress.style.strokeDasharray = '100';
        badgeProgress.style.strokeDashoffset = String(100 * (1 - clamped));
      }

      // Outer capsule border = Daily Focus Goal progress
      const focusGoalMs = Number(state.focusGoalMs || 0);
      const todayFocusMs = Number(state.todayFocusMs || 0);
      if (focusGoalMs <= 0) {
        island.classList.add('no-goal');
        island.classList.remove('goal-complete');
        island.style.setProperty('--goal-pct', '0');
      } else {
        island.classList.remove('no-goal');
        const goalPct = Math.max(0, Math.min(100, (todayFocusMs / focusGoalMs) * 100));
        island.classList.toggle('goal-complete', goalPct >= 100);
        island.style.setProperty('--goal-pct', goalPct.toFixed(2));
      }

      refreshWideDetail();
      syncBadgeGeometry();
    }

    syncBadgeGeometry();

    if (window.islandBridge) {
      window.islandBridge.onStateUpdate(applyState);
      window.islandBridge.onConfigUpdate?.(applyConfig);
    }

    window.addEventListener('resize', () => {
      refreshWideDetail();
      syncBadgeGeometry();
    });

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.islandBridge?.sendAction('toggle');
    });

    skipBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.islandBridge?.sendAction('skip');
    });

    // Right-click native context menu (Lock/Unlock, Position, Width, Wide Details, Visibility)
    island.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      window.islandBridge?.showContextMenu?.();
    });

    // Edge resize handles (active only when unlocked)
    let resizeSession = null;

    function startResize(side, e) {
      if (currentConfig.locked) return;
      e.stopPropagation();
      e.preventDefault();
      resizeSession = { side, lastScreenX: e.screenX };
      e.currentTarget.setPointerCapture(e.pointerId);
    }

    function moveResize(e) {
      if (!resizeSession) return;
      const dx = e.screenX - resizeSession.lastScreenX;
      if (Math.abs(dx) >= 1) {
        resizeSession.lastScreenX = e.screenX;
        window.islandBridge?.resizeBy?.(dx, resizeSession.side);
      }
    }

    function endResize() {
      if (!resizeSession) return;
      resizeSession = null;
      window.islandBridge?.saveLayout?.();
    }

    resizeLeft.addEventListener('pointerdown', (e) => startResize('left', e));
    resizeLeft.addEventListener('pointermove', moveResize);
    resizeLeft.addEventListener('pointerup', endResize);
    resizeLeft.addEventListener('pointercancel', endResize);

    resizeRight.addEventListener('pointerdown', (e) => startResize('right', e));
    resizeRight.addEventListener('pointermove', moveResize);
    resizeRight.addEventListener('pointerup', endResize);
    resizeRight.addEventListener('pointercancel', endResize);

    // Horizontal drag (only when unlocked) + left-click to open main Zonein window
    let pointerState = null;

    island.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('button') || e.target.closest('.resize-handle')) return;
      pointerState = {
        didDrag: false,
        lastScreenX: e.screenX,
      };
      island.setPointerCapture(e.pointerId);
    });

    island.addEventListener('pointermove', (e) => {
      if (!pointerState || currentConfig.locked) return;
      const dx = e.screenX - pointerState.lastScreenX;
      if (Math.abs(dx) >= 2) {
        pointerState.didDrag = true;
        island.classList.add('dragging');
        pointerState.lastScreenX = e.screenX;
        window.islandBridge?.moveBy(dx);
      }
    });

    island.addEventListener('pointerup', (e) => {
      if (!pointerState) return;
      const didDrag = pointerState.didDrag;
      pointerState = null;
      island.classList.remove('dragging');
      if (didDrag && !currentConfig.locked) {
        window.islandBridge?.saveLayout?.();
      } else if (!e.target.closest('button') && !e.target.closest('.resize-handle')) {
        window.islandBridge?.sendAction('show-main');
      }
    });

    island.addEventListener('pointercancel', () => {
      pointerState = null;
      island.classList.remove('dragging');
    });
  </script>
</body>
</html>
